[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-feishu-streaming-card"
version = "5.0.8"
description = "Hermes Gateway Feishu streaming card sidecar plugin"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["Hermes", "Feishu", "Lark", "streaming-card", "sidecar"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "aiohttp>=3.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "tomli>=1.1.0; python_version < '3.11'",
]
quality = [
  "ruff==0.17.2; python_version >= '3.10'",
  "mypy==2.4.0; python_version >= '3.10'",
]

[project.scripts]
hermes-feishu-card = "hermes_feishu_card.cli:main"

[project.entry-points."hermes_agent.plugins"]
hermes-feishu-card = "hermes_feishu_card.hermes_plugin"

[project.urls]
Repository = "https://github.com/baileyh8/hermes-feishu-streaming-card"
Issues = "https://github.com/baileyh8/hermes-feishu-streaming-card/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["hermes_feishu_card*"]

[tool.setuptools.package-data]
"hermes_feishu_card" = ["preview_template.html"]
"hermes_feishu_card.install._native_hook_provenance" = [
  "provenance.json",
  "slices/*.py",
]

# Incremental checks cover extracted boundaries, not the archived or legacy
# coordinators. The runtime Python floor remains >=3.9; CI tests it separately.
[tool.ruff]
target-version = "py39"
include = [
  "hermes_feishu_card/cli_reports.py",
  "hermes_feishu_card/card_view.py",
  "hermes_feishu_card/display_redaction.py",
