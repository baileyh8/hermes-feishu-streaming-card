name: tests

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit to test
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HFC_FIXED_TAG_COMMIT: 3c27eb6234bf91b8ceee9e9071591b31e9b148cb

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install scoped quality tools
        run: python -m pip install -e ".[test,quality]"
      - name: Lint extracted boundaries
        run: python -m ruff check
      - name: Type-check extracted boundaries
        run: python -m mypy

  upstream-hermes-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Checkout earlier supported Hermes release fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 29112bef099274229cadff79cdff7bf7b99c4b77
          path: .upstream/stable
      - name: Checkout earlier supported Hermes main fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 2179a279ae04bfadf8efbc49a01ca0abfb738000
          path: .upstream/main
      - name: Checkout recorded production Hermes source fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 180291162ff4df0d42b5dc4fecd08005cf7cebf9
          path: .upstream/production
      - name: Checkout reported Hermes 0.17 release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 2bd1977d8fad185c9b4be47884f7e87f1add0ce3
          path: .upstream/historical
      - name: Checkout reported Docker image source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 63279301bcbdc185c1b07b98a9312eb0c862f26d
          path: .upstream/image
      - name: Checkout extracted clarify Hermes snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 6005aa1fd9aac8b1024ace50fec8cd1c85a04bae
          path: .upstream/extracted
      - name: Checkout pinned Hermes latest_stable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: e06df9c2eae6901f4c88f464e0ae6e753c0428b8 # v0.22.0
          path: .upstream/latest_stable
      - name: Checkout pinned Hermes latest_main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 0e427d788d253630d38a3a51cd76849e73cd6925 # main observed 2026-10-14
          path: .upstream/latest_main
      - name: Checkout reported Hermes issue 428 revision 297552
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 297552a9d646119871391d202509822cd86330df
          path: .upstream/issue428_297552
      - name: Checkout reported Hermes issue 428 revision 7bda2a
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 7bda2a3368024f7ae1c70cef16583e7c2c891674
          path: .upstream/issue428_7bda2a
      - name: Install test dependencies
        run: python -m pip install -e ".[test]" "uv==0.11.7" ruamel.yaml tomli-w packaging wheel
      - name: Verify source-only install, repeat, diagnosis and exact restore
        env:
          HFC_UPSTREAM_LATEST_STABLE_ROOT: ${{ github.workspace }}/.upstream/latest_stable
          HFC_UPSTREAM_LATEST_MAIN_ROOT: ${{ github.workspace }}/.upstream/latest_main
          HFC_UPSTREAM_STABLE_ROOT: ${{ github.workspace }}/.upstream/stable
          HFC_UPSTREAM_MAIN_ROOT: ${{ github.workspace }}/.upstream/main
          HFC_UPSTREAM_PRODUCTION_ROOT: ${{ github.workspace }}/.upstream/production
          HFC_UPSTREAM_HISTORICAL_ROOT: ${{ github.workspace }}/.upstream/historical
          HFC_UPSTREAM_IMAGE_ROOT: ${{ github.workspace }}/.upstream/image
          HFC_UPSTREAM_EXTRACTED_ROOT: ${{ github.workspace }}/.upstream/extracted
          HFC_UPSTREAM_ISSUE428_297552_ROOT: ${{ github.workspace }}/.upstream/issue428_297552
          HFC_UPSTREAM_ISSUE428_7BDA2A_ROOT: ${{ github.workspace }}/.upstream/issue428_7bda2a
        run: python -m pytest tests/integration/test_upstream_hermes_compat.py -q
      - name: Prepare ordinary wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/hfc-pm-wheel" .
          python - <<'PY'
          import os
          from pathlib import Path
          wheel, = (Path(os.environ["RUNNER_TEMP"]) / "hfc-pm-wheel").glob("*.whl")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"HFC_TEST_WHEEL={wheel}\n")
          PY
      - name: Verify ordinary wheel survives real upstream PM generations
        env:
          HFC_UPSTREAM_PM_ROOT: ${{ github.workspace }}/.upstream/issue428_7bda2a
        run: python -m pytest tests/integration/test_pm_generation.py -q

  fixed-hermes-fixture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Hermes fixed-tag source once
        shell: bash
        run: |
          set -euo pipefail
          fixed_root="$RUNNER_TEMP/hermes-agent-v2026.8.3-v430-audit"
          test ! -e "$fixed_root"
          GIT_LFS_SKIP_SMUDGE=1 git clone --quiet --filter=blob:none --depth=1 \
            --branch v2026.8.3 \
            https://github.com/NousResearch/hermes-agent.git \
            "$fixed_root"
          test "$(git -C "$fixed_root" rev-parse HEAD)" = \
            "$HFC_FIXED_TAG_COMMIT"
          test -z "$(git -C "$fixed_root" status --porcelain)"
          test -z "$(git -C "$fixed_root" rev-list --objects --missing=print HEAD | sed -n '/^?/p')"
          tar -czf "$RUNNER_TEMP/hermes-v2026.8.3-fixed-tag.tar.gz" \
            -C "$RUNNER_TEMP" hermes-agent-v2026.8.3-v430-audit
      - name: Upload immutable Hermes fixed-tag fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-v2026.8.3-fixed-tag
          path: ${{ runner.temp }}/hermes-v2026.8.3-fixed-tag.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  pytest:
    needs: fixed-hermes-fixture
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Download immutable Hermes fixed-tag fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hermes-v2026.8.3-fixed-tag
          path: ${{ runner.temp }}
      - name: Restore exact Hermes fixed-tag source
        shell: bash
        run: |
          set -euo pipefail
          fixed_root="$RUNNER_TEMP/hermes-agent-v2026.8.3-v430-audit"
          test ! -e "$fixed_root"
          tar -xzf "$RUNNER_TEMP/hermes-v2026.8.3-fixed-tag.tar.gz" \
            -C "$RUNNER_TEMP"
          test "$(git -C "$fixed_root" rev-parse HEAD)" = \
            "$HFC_FIXED_TAG_COMMIT"
          test -z "$(git -C "$fixed_root" status --porcelain)"
          test -z "$(git -C "$fixed_root" rev-list --objects --missing=print HEAD | sed -n '/^?/p')"
          printf 'HFC_FIXED_TAG_SOURCE_ROOT=%s\n' "$fixed_root" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  pytest-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: >-
          python -m pytest -q
          tests/unit/test_bots.py
          tests/unit/test_card_limits.py
          tests/unit/test_cardkit.py
          tests/unit/test_config.py
          tests/unit/test_delivery_policy.py
          tests/unit/test_diagnostics.py
          tests/unit/test_event_auth.py
          tests/unit/test_events.py
          tests/unit/test_feishu_client.py
          tests/unit/test_hook_runtime.py
          tests/unit/test_notice_routing_regressions.py
          tests/unit/test_lifecycle.py
          tests/unit/test_render.py
          tests/unit/test_stream_thinking_to_body.py
          tests/unit/test_331_adapted.py
          tests/unit/test_runner.py
          tests/unit/test_control_token_file.py
          tests/unit/test_session.py
          tests/unit/test_status.py
          tests/unit/test_subscription_usage.py
          tests/unit/test_text.py
          tests/integration/test_card_freeze.py
          tests/integration/test_clarify_multi_select.py
          tests/integration/test_feishu_client_http.py
          tests/integration/test_hook_runtime_integration.py
          tests/integration/test_server.py

  pytest-macos:
    needs: fixed-hermes-fixture
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Download immutable Hermes fixed-tag fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hermes-v2026.8.3-fixed-tag
          path: ${{ runner.temp }}
      - name: Restore exact Hermes fixed-tag source
        shell: bash
        run: |
          set -euo pipefail
          fixed_root="$RUNNER_TEMP/hermes-agent-v2026.8.3-v430-audit"
          test ! -e "$fixed_root"
          tar -xzf "$RUNNER_TEMP/hermes-v2026.8.3-fixed-tag.tar.gz" \
            -C "$RUNNER_TEMP"
          test "$(git -C "$fixed_root" rev-parse HEAD)" = \
            "$HFC_FIXED_TAG_COMMIT"
          test -z "$(git -C "$fixed_root" status --porcelain)"
          test -z "$(git -C "$fixed_root" rev-list --objects --missing=print HEAD | sed -n '/^?/p')"
          printf 'HFC_FIXED_TAG_SOURCE_ROOT=%s\n' "$fixed_root" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  feishu-sdk-compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact Feishu WebSocket compatibility matrix
        run: |
          python -m pip install -e ".[test]"
          python -m pip install "lark-oapi==1.6.8" "websockets==15.0.1"
      - name: Test live handler compatibility
        run: python -m pytest tests/integration/test_feishu_sdk_compat.py tests/unit/test_cold_start_card_callbacks.py -q

  feishu-sdk-compat-python314:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install exact Feishu WebSocket compatibility matrix
        run: |
          python -m pip install -e ".[test]"
          python -m pip install "lark-oapi==1.6.8" "websockets==15.0.1"
      - name: Test live handler compatibility
        run: python -m pytest tests/integration/test_feishu_sdk_compat.py tests/unit/test_cold_start_card_callbacks.py -q

      - name: Test Python 3.14 semantic slice fingerprints
        run: python -m pytest tests/unit/test_hook_runtime.py -k "slice or literal_slice" -q

  docker-compose-runtime-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Validate published Docker Compose topology
        env:
          FEISHU_APP_ID: cli_test_only
          FEISHU_APP_SECRET: test_only_not_a_real_secret
          HFC_VERSION: v5.0.2
        run: docker compose -f docker-compose.example.yml config --quiet
      - name: Start published Compose smoke topology
        run: >-
          docker compose -f docker-compose.smoke.yml up
          --detach --wait --wait-timeout 180 --quiet-pull gateway
      - name: Show Compose logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.smoke.yml ps -a
          docker compose -f docker-compose.smoke.yml logs --no-color setup sidecar gateway
      - name: Probe installed Gateway and sidecar
        run: >-
          timeout 30 docker compose -f docker-compose.smoke.yml run
          --rm --no-deps probe
      - name: Clean Compose smoke resources
        if: always()
        run: docker compose -f docker-compose.smoke.yml down --volumes --remove-orphans

  powershell-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Windows regression dependencies
        run: python -m pip install -e ".[test]"
      - name: Parse Windows installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install.ps1"),
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Test Windows installer contract
        shell: pwsh
        run: python -m pytest tests/unit/test_install_scripts.py -k "powershell" -q
      - name: Test manifestless legacy migration on Windows
        run: >-
          python -m pytest tests/integration/test_cli_install.py
          -k "manifestless or portable_windows_exclusive_handle or portable_existing_write"
          -q
